[project]
name = "credit-default-risk"
version = "2.0.0"
description = "Credit default risk model with an independent validation review"
requires-python = ">=3.10,<3.11"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "modular_code/modular_code/_original_backup",  # kept verbatim as evidence
    "modular_code/modular_code/lib",               # mirror of notebooks/, see below
    "notebooks",                                   # exploratory, not production code
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced here
    "B008",   # function call in default argument - intentional in argparse setup
    "SIM108", # ternary rewrites are not always clearer
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import in odd orders after sys.path manipulation, and use
# bare asserts and fixtures that read as unused arguments.
"**/tests/*.py" = ["E402", "F811", "B011"]
"**/analysis/*.py" = ["E402"]     # sys.path insert before local imports
"**/engine*.py" = ["E402"]
"**/predict*.py" = ["E402"]
"**/validate_data.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ml_pipeline"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["modular_code/modular_code/tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]
